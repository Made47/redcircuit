plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-fabric"
}

repositories {
    // REI (opcjonalna integracja; na NeoForge jest JEI) + jego zależności (Architectury, Cloth Config)
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
    }
    // Jade (opcjonalna integracja) - z repozytorium Modrinth
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter { includeGroup "maven.modrinth" }
    }
    // CC: Tweaked (opcjonalna integracja)
    maven {
        name = "SquidDev"
        url = "https://maven.squiddev.cc"
        content { includeGroup("cc.tweaked") }
    }
    mavenCentral()
}

loom {
    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Oficjalne nazwy Mojang - te same co w wersji NeoForge, dzięki czemu kod jest wspólny
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Energia: Team Reborn Energy (standard na Fabricu), dołączona do jara moda
    include api("teamreborn:energy:${project.energy_version}")

    // REI: API do kompilacji, pełny mod tylko przy uruchamianiu z IDE (runClient)
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}"
    localRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    // Klasy, których API REI używa w sygnaturach (Point/Rectangle, FluidStack z Architectury)
    compileOnly "dev.architectury:architectury-fabric:${project.architectury_version}"
    compileOnly "me.shedaniel.cloth:basic-math:${project.cloth_math_version}"

    // Jade: tylko do kompilacji - podpowiedzi RedCircuit pojawiają się, gdy Jade jest zainstalowany
    compileOnly "maven.modrinth:jade:${project.jade_version}"

    // CC: Tweaked: tylko do kompilacji - kabel wiązkowy i peryferia działają, gdy mod jest zainstalowany
    compileOnly "cc.tweaked:cc-tweaked-${project.minecraft_version}-core-api:${project.cct_version}"
    compileOnly "cc.tweaked:cc-tweaked-${project.minecraft_version}-common-api:${project.cct_version}"
    compileOnly "cc.tweaked:cc-tweaked-${project.minecraft_version}-fabric-api:${project.cct_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
